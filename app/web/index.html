<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Excel-to-PPT Automation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', sans-serif; background: #f5f7fa; color: #333; }
        .container { max-width: 900px; margin: 0 auto; padding: 2rem; }
        h1 { color: #003366; margin-bottom: 0.5rem; }
        .subtitle { color: #666; margin-bottom: 2rem; }
        .upload-section { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 2rem; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; font-weight: bold; margin-bottom: 0.5rem; color: #003366; }
        input[type="file"] { border: 2px dashed #ccc; padding: 1rem; width: 100%; border-radius: 8px; cursor: pointer; }
        input[type="file"]:hover { border-color: #0066CC; }
        select, input[type="text"] { width: 100%; padding: 0.7rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        .btn { background: #003366; color: white; border: none; padding: 0.8rem 2rem; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #0066CC; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        .progress-section { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 2rem; display: none; }
        .progress-bar { width: 100%; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 1rem 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #003366, #0066CC); transition: width 0.5s; }
        .status-text { color: #666; font-size: 0.9rem; }
        .result-section { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: none; }
        .download-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
        .download-card { border: 1px solid #eee; border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.3s; }
        .download-card:hover { border-color: #0066CC; background: #f0f7ff; }
        .download-card h3 { color: #003366; font-size: 0.9rem; margin-bottom: 0.5rem; }
        .error { color: #cc3333; background: #fff5f5; padding: 1rem; border-radius: 8px; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>LLM Excel-to-PPT Automation</h1>
        <p class="subtitle">信用卡業務 Excel 報表自動轉換為策略簡報</p>

        <div class="upload-section">
            <form id="uploadForm">
                <div class="form-group">
                    <label>Excel 資料檔案 *</label>
                    <input type="file" id="excelFile" accept=".xlsx,.xls" required>
                </div>
                <div class="form-group">
                    <label>PowerPoint 模板 (選填)</label>
                    <input type="file" id="templateFile" accept=".pptx">
                </div>
                <div class="form-group">
                    <label>目標機構</label>
                    <input type="text" id="targetInstitution" value="台新銀行">
                </div>
                <div class="form-group">
                    <label>LLM 模型</label>
                    <select id="modelSelect">
                        <option value="anthropic.claude-sonnet-4-20250514">Claude Sonnet 4</option>
                        <option value="anthropic.claude-3-5-sonnet-20241022-v2:0">Claude 3.5 Sonnet v2</option>
                        <option value="anthropic.claude-3-haiku-20240307-v1:0">Claude 3 Haiku</option>
                    </select>
                </div>
                <button type="submit" class="btn" id="submitBtn">開始生成簡報</button>
            </form>
        </div>

        <div class="progress-section" id="progressSection">
            <h2>處理進度</h2>
            <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width: 0%"></div></div>
            <p class="status-text" id="statusText">準備中...</p>
        </div>

        <div class="result-section" id="resultSection">
            <h2>結果下載</h2>
            <div class="download-grid">
                <div class="download-card" onclick="download('ppt')">
                    <h3>PowerPoint 簡報</h3>
                    <p>16 頁策略簡報</p>
                </div>
                <div class="download-card" onclick="download('excel')">
                    <h3>分析結果 Excel</h3>
                    <p>指標計算結果</p>
                </div>
                <div class="download-card" onclick="download('lineage')">
                    <h3>資料血緣</h3>
                    <p>數值追溯紀錄</p>
                </div>
                <div class="download-card" onclick="download('qa_report')">
                    <h3>QA 報告</h3>
                    <p>品質校驗結果</p>
                </div>
            </div>
            <div id="errorDisplay" class="error" style="display:none"></div>
        </div>
    </div>

    <script>
        let currentTaskId = null;
        const API_BASE = window.location.origin;

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            const excelFile = document.getElementById('excelFile').files[0];
            if (!excelFile) { alert('請選擇 Excel 檔案'); return; }

            formData.append('excel_file', excelFile);
            const templateFile = document.getElementById('templateFile').files[0];
            if (templateFile) formData.append('template_file', templateFile);
            formData.append('target_institution', document.getElementById('targetInstitution').value);
            formData.append('model_id', document.getElementById('modelSelect').value);
            formData.append('use_llm', 'true');
            formData.append('region', 'us-east-1');

            document.getElementById('submitBtn').disabled = true;
            document.getElementById('progressSection').style.display = 'block';
            document.getElementById('resultSection').style.display = 'none';

            try {
                const res = await fetch(`${API_BASE}/api/upload`, { method: 'POST', body: formData });
                const data = await res.json();
                currentTaskId = data.task_id;
                pollStatus();
            } catch (err) {
                showError('上傳失敗: ' + err.message);
            }
        });

        async function pollStatus() {
            if (!currentTaskId) return;
            try {
                const res = await fetch(`${API_BASE}/api/status/${currentTaskId}`);
                const data = await res.json();
                document.getElementById('progressFill').style.width = data.progress + '%';
                document.getElementById('statusText').textContent = data.current_step || '處理中...';

                if (data.status === 'completed') {
                    document.getElementById('resultSection').style.display = 'block';
                    document.getElementById('submitBtn').disabled = false;
                } else if (data.status === 'failed') {
                    showError('處理失敗: ' + (data.error || '未知錯誤'));
                    document.getElementById('submitBtn').disabled = false;
                } else {
                    setTimeout(pollStatus, 2000);
                }
            } catch (err) {
                setTimeout(pollStatus, 3000);
            }
        }

        function download(fileType) {
            if (currentTaskId) {
                window.open(`${API_BASE}/api/download/${currentTaskId}/${fileType}`);
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorDisplay');
            el.textContent = msg;
            el.style.display = 'block';
        }
    </script>
</body>
</html>
